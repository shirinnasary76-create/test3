<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثبت‌نام / ورود | هندلینگ دلگشا</title><link rel="stylesheet" href="style.css"></head><body class="register-page"><main class="register-card"><a class="brand" href="index.html"><b>د</b><span><strong>هندلینگ دلگشا</strong><small>خدمات اداری و سازمانی</small></span></a><label>پنل مخاطبان</label><h1>ثبت‌نام / ورود</h1><p>این صفحه قالب اولیه ثبت درخواست است. برای ثبت‌نام واقعی به سامانه کاربری و پایگاه داده نیاز است.</p><form id="reg"><label>نام و نام خانوادگی<input name="name" required></label><label>شماره تماس یا ایمیل<input name="contact" required></label><label>نوع درخواست<select name="request"><option>درخواست همکاری</option><option>دریافت اطلاعات خدمات</option><option>پیگیری درخواست</option></select></label><button class="btn orange" type="submit">ثبت درخواست اولیه</button><p id="status"></p></form><a class="back" href="index.html">← بازگشت به صفحه اصلی</a></main><script>document.getElementById("reg").addEventListener("submit",async e=>{e.preventDefault();const d=new FormData(e.target),t="درخواست هندلینگ دلگشا\nنام: "+d.get("name")+"\nراه ارتباطی: "+d.get("contact")+"\nنوع: "+d.get("request");try{await navigator.clipboard.writeText(t);document.getElementById("status").textContent="متن درخواست کپی شد؛ برای ارسال با مجموعه تماس بگیرید."}catch{document.getElementById("status").textContent=t}})</script></body></html>
